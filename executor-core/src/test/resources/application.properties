spring.profiles.active=test

# H2 in-memory database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*Mapper.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Schema initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema-test.sql

# XXL-Job (test config — won't actually connect)
xxl.job.admin.address=http://localhost:8080/xxl-job-admin
xxl.job.admin.token=test_token
xxl.job.admin.appname=test-app
xxl.job.executor.address=
xxl.job.executor.ip=
xxl.job.executor.port=9999
xxl.job.executor.logpath=/tmp/xxl-job
xxl.job.executor.logretentiondays=7

# Disable RocketMQ auto-configuration

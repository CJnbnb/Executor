<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executor Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #1f2937; }

        .header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #3b82f6; }
        .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
        .header .ver { font-size: 11px; color: #94a3b8; background: rgba(255,255,255,.1); padding: 3px 10px; border-radius: 10px; }
        .wrap { max-width: 1340px; margin: 0 auto; padding: 20px 24px; }

        .cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 10px; padding: 18px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); text-align: center; transition: transform .15s, box-shadow .15s; cursor: default; border: 1px solid #f1f5f9; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .card .num { font-size: 26px; font-weight: 700; transition: color .2s; }
        .card .label { font-size: 12px; color: #64748b; margin-top: 4px; font-weight: 500; }
        .card.c-total .num { color: #3b82f6; }
        .card.c-enabled .num { color: #10b981; }
        .card.c-pending .num { color: #f59e0b; }
        .card.c-processing .num { color: #8b5cf6; }
        .card.c-stuck .num { color: #ef4444; }
        .card.c-disabled .num { color: #94a3b8; }
        .card .num.loading { color: #cbd5e1 !important; font-size: 18px; }
        .card .num.error { color: #ef4444 !important; font-size: 14px; }

        .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; background: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border: 1px solid #f1f5f9; }
        .toolbar input, .toolbar select { padding: 7px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px; outline: none; background: #f8fafc; transition: border-color .2s, box-shadow .2s; }
        .toolbar input { width: 150px; }
        .toolbar select { width: 110px; }
        .toolbar input:focus, .toolbar select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); background: #fff; }
        .toolbar button { padding: 7px 14px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; transition: background .2s, opacity .2s; }
        .toolbar button:disabled { opacity: .5; cursor: default; }
        .toolbar .sep { width: 1px; height: 24px; background: #e2e8f0; margin: 0 6px; }
        .batch-actions { display: none; gap: 6px; align-items: center; }
        .batch-actions button { font-size: 12px; padding: 6px 12px; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-muted { background: #64748b; color: #fff; }
        .btn-muted:hover { background: #475569; }
        .btn-auto { background: #059669 !important; color: #fff; }
        .btn-auto.off { background: #94a3b8 !important; }

        .box { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden; border: 1px solid #f1f5f9; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8fafc; padding: 11px 14px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; white-space: nowrap; user-select: none; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
        th.sortable { cursor: pointer; }
        th.sortable:hover { background: #f1f5f9; color: #1e293b; }
        th .sort-arrow { margin-left: 4px; font-size: 10px; }
        td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        tr:hover td { background: #f8fafc; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: .2px; }
        .tag-on { background: #d1fae5; color: #065f46; }
        .tag-off { background: #fee2e2; color: #991b1b; }
        .tag-pending { background: #f3f4f6; color: #6b7280; }
        .tag-processing { background: #ede9fe; color: #6d28d9; }
        .tag-done { background: #dbeafe; color: #1e40af; }
        .tag-exception { background: #fee2e2; color: #991b1b; }
        .btn-sm { padding: 4px 12px; border: none; border-radius: 5px; font-size: 11px; cursor: pointer; margin: 0 2px; font-weight: 500; transition: background .15s; }
        .btn-sm:disabled { opacity: .5; cursor: default; }
        .btn-toggle { background: #f59e0b; color: #fff; }
        .btn-toggle:hover:not(:disabled) { background: #d97706; }
        .btn-del { background: #ef4444; color: #fff; }
        .btn-del:hover:not(:disabled) { background: #dc2626; }
        .btn-release { background: #8b5cf6; color: #fff; }
        .btn-release:hover:not(:disabled) { background: #7c3aed; }

        .pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 13px; color: #64748b; border-top: 1px solid #f1f5f9; }
        .pager button { padding: 6px 14px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; transition: background .15s; }
        .pager button:disabled { opacity: .4; cursor: default; }
        .pager button:hover:not(:disabled) { background: #f1f5f9; }
        .empty { text-align: center; padding: 48px; color: #94a3b8; font-size: 14px; }
        .clickable { cursor: pointer; color: #3b82f6; font-weight: 500; }
        .clickable:hover { text-decoration: underline; color: #2563eb; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15,23,42,.5); backdrop-filter: blur(2px); justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 12px; width: 580px; max-width: 92vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.16); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; border-radius: 12px 12px 0 0; }
        .modal-header h3 { font-size: 16px; color: #1e293b; }
        .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #94a3b8; padding: 4px 8px; border-radius: 6px; transition: color .15s, background .15s; }
        .modal-close:hover { color: #1e293b; background: #e2e8f0; }
        .modal-body { padding: 18px 22px; }
        .modal-body .kv { display: flex; margin-bottom: 10px; font-size: 13px; align-items: flex-start; }
        .modal-body .kv .k { width: 100px; color: #64748b; flex-shrink: 0; font-weight: 500; }
        .modal-body .kv .v { color: #1e293b; word-break: break-all; }
        .modal-body .kv .v code { background: #f1f5f9; padding: 4px 10px; border-radius: 6px; font-size: 12px; max-height: 150px; overflow-y: auto; display: block; white-space: pre-wrap; border: 1px solid #e2e8f0; }
        .modal-footer { padding: 12px 22px; border-top: 1px solid #e2e8f0; text-align: right; background: #f8fafc; border-radius: 0 0 12px 12px; }

        .toast { position: fixed; top: 20px; right: 20px; z-index: 2000; background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        .toast.show { opacity: 1; }
        .toast.error { background: #ef4444; }
    </style>
</head>
<body>

<div class="header">
    <h1>Executor Dashboard</h1>
    <span class="ver">v1.2</span>
</div>

<div class="wrap">

    <div class="cards">
        <div class="card c-total"><div class="num" id="stat-total">-</div><div class="label">任务总数</div></div>
        <div class="card c-enabled"><div class="num" id="stat-enabled">-</div><div class="label">已启用</div></div>
        <div class="card c-pending"><div class="num" id="stat-pending">-</div><div class="label">待执行</div></div>
        <div class="card c-processing"><div class="num" id="stat-processing">-</div><div class="label">处理中</div></div>
        <div class="card c-stuck"><div class="num" id="stat-stuck">-</div><div class="label">卡住(&gt;1min)</div></div>
        <div class="card c-disabled"><div class="num" id="stat-disabled">-</div><div class="label">已禁用</div></div>
    </div>

    <div class="toolbar">
        <input type="text" id="search-task" placeholder="任务名称..." onkeydown="if(event.key==='Enter')search()">
        <input type="text" id="search-biz" placeholder="bizName..." onkeydown="if(event.key==='Enter')search()">
        <input type="text" id="search-bizGroup" placeholder="bizGroup..." onkeydown="if(event.key==='Enter')search()">
        <select id="search-enable" onchange="search()">
            <option value="">启用状态</option>
            <option value="1">已启用</option>
            <option value="0">已禁用</option>
        </select>
        <select id="search-process" onchange="search()">
            <option value="">执行状态</option>
            <option value="pending">待处理</option>
            <option value="processing">处理中</option>
            <option value="stuck">卡住</option>
            <option value="exception">异常</option>
        </select>
        <button onclick="search()">查询</button>
        <button onclick="resetSearch()" style="background:#6b7280">重置</button>
        <button onclick="refresh()" style="background:#6b7280">刷新</button>
        <span class="sep"></span>
        <div class="batch-actions" id="batch-actions">
            <span id="batch-count" style="font-size:13px;color:#6b7280">已选 0 项</span>
            <button onclick="batchToggle('1')" style="background:#10b981">批量启用</button>
            <button onclick="batchToggle('0')" style="background:#f59e0b">批量禁用</button>
            <button onclick="batchDelete()" style="background:#ef4444">批量删除</button>
            <button onclick="batchRelease()" style="background:#8b5cf6">批量释放</button>
        </div>
        <button id="btn-auto-refresh" class="btn-auto off" onclick="toggleAutoRefresh()">自动刷新: 关</button>
        <button onclick="exportCSV()" style="background:#059669">导出 CSV</button>
    </div>

    <div class="box">
        <table>
            <thead>
                <tr>
                    <th style="width:36px"><input type="checkbox" id="select-all" onchange="toggleSelectAll()"></th>
                    <th>任务ID</th>
                    <th>任务名</th>
                    <th class="sortable" onclick="setSort('biz_name')">bizName <span class="sort-arrow" id="arrow-biz_name"></span></th>
                    <th class="sortable" onclick="setSort('biz_group')">bizGroup <span class="sort-arrow" id="arrow-biz_group"></span></th>
                    <th>调度配置</th>
                    <th class="sortable" onclick="setSort('next_trigger_time')">下次触发 <span class="sort-arrow" id="arrow-next_trigger_time"></span></th>
                    <th>启用</th>
                    <th>执行状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div class="pager">
            <span id="pager-info">共 0 条</span>
            <div>
                <button id="btn-prev" onclick="prevPage()" disabled>上一页</button>
                <button id="btn-next" onclick="nextPage()" disabled>下一页</button>
            </div>
        </div>
    </div>

</div>

<!-- Task Detail Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <div class="modal-header">
            <h3>任务详情</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
            <button onclick="closeModal()" style="padding:6px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px">关闭</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let page = 1, size = 20, totalPages = 0;
let selectedIds = new Set();
let autoRefresh = false, autoRefreshInterval = null;
let busy = false;
let sortBy = '', sortDir = '';

function loadStats() {
    let ids = ['total','enabled','pending','processing','stuck','disabled'];
    ids.forEach(id => document.getElementById('stat-' + id).textContent = '...');
    fetch('/dashboard/api/stats')
        .then(r => r.json())
        .then(d => {
            document.getElementById('stat-total').textContent = d.total;
            document.getElementById('stat-enabled').textContent = d.enabled;
            document.getElementById('stat-pending').textContent = d.pending;
            document.getElementById('stat-processing').textContent = d.processing;
            document.getElementById('stat-stuck').textContent = d.stuck;
            document.getElementById('stat-disabled').textContent = d.disabled;
        })
        .catch(() => {
            ids.forEach(id => {
                document.getElementById('stat-' + id).textContent = 'ERR';
                document.getElementById('stat-' + id).className = 'num error';
            });
        });
}

function loadTasks() {
    if (busy) return;
    busy = true;
    document.getElementById('tbody').innerHTML = '<tr><td colspan="10" class="empty">加载中...</td></tr>';

    let params = new URLSearchParams({ page, size });
    let taskName = document.getElementById('search-task').value.trim();
    let bizName = document.getElementById('search-biz').value.trim();
    let bizGroup = document.getElementById('search-bizGroup').value.trim();
    let enable = document.getElementById('search-enable').value;
    let process = document.getElementById('search-process').value;
    if (taskName) params.set('taskName', taskName);
    if (bizName) params.set('bizName', bizName);
    if (bizGroup) params.set('bizGroup', bizGroup);
    if (enable) params.set('enable', enable);
    if (process) params.set('process', process);
    if (sortBy) { params.set('sortBy', sortBy); params.set('sortDir', sortDir); }

    fetch('/dashboard/api/tasks?' + params)
        .then(r => r.json())
        .then(d => {
            busy = false;
            totalPages = d.totalPages;
            document.getElementById('pager-info').textContent = '共 ' + d.total + ' 条，第 ' + page + '/' + Math.max(totalPages, 1) + ' 页';
            document.getElementById('btn-prev').disabled = page <= 1;
            document.getElementById('btn-next').disabled = page >= totalPages;

            let tbody = document.getElementById('tbody');
            if (!d.list || d.list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty">暂无数据</td></tr>';
                return;
            }
            selectedIds.clear();
            document.getElementById('select-all').checked = false;
            updateBatchBar();
            tbody.innerHTML = d.list.map(t => {
                let timeStr = t.nextTriggerTime ? new Date(t.nextTriggerTime).toLocaleString('zh-CN') : '-';
                let enableTag = t.enable === '1'
                    ? '<span class="tag tag-on">启用</span>'
                    : '<span class="tag tag-off">禁用</span>';
                let toggleText = t.enable === '1' ? '禁用' : '启用';

                let processTag = '';
                if (t.process === 'processing') {
                    processTag = '<span class="tag tag-processing">处理中</span>';
                } else if (t.process === 'pending') {
                    processTag = '<span class="tag tag-pending">待处理</span>';
                } else if (t.process === 'exception') {
                    processTag = '<span class="tag tag-exception">异常</span>';
                } else {
                    processTag = '<span class="tag">' + esc(t.process || '') + '</span>';
                }

                let sid = escAttr(t.id);
                return '<tr>'
                    + '<td><input type="checkbox" class="row-check" value="' + sid + '" onchange="onCheck(this)"></td>'
                    + '<td class="clickable" title="' + sid + '" onclick="showDetail(\'' + sid + '\')">' + (t.id.length > 16 ? t.id.substring(0, 16) + '...' : t.id) + '</td>'
                    + '<td>' + esc(t.taskName) + '</td>'
                    + '<td>' + esc(t.bizName) + '</td>'
                    + '<td>' + esc(t.bizGroup) + '</td>'
                    + '<td style="font-size:12px">' + (t.scheduledConf || '一次性') + '</td>'
                    + '<td style="font-size:12px">' + timeStr + '</td>'
                    + '<td>' + enableTag + '</td>'
                    + '<td>' + processTag + '</td>'
                    + '<td>'
                    + '<button class="btn-sm btn-toggle" onclick="toggleEnable(\'' + sid + '\')">' + toggleText + '</button>'
                    + (t.process === 'processing' ? '<button class="btn-sm btn-release" onclick="releaseTask(\'' + sid + '\')">释放</button>' : '')
                    + '<button class="btn-sm btn-del" onclick="delTask(\'' + sid + '\')">删除</button>'
                    + '</td>'
                    + '</tr>';
            }).join('');
            updateSortArrows();
        })
        .catch(err => {
            busy = false;
            document.getElementById('tbody').innerHTML = '<tr><td colspan="10" class="empty" style="color:#ef4444">加载失败: ' + esc('' + err) + '</td></tr>';
        });
}

function onCheck(cb) {
    if (cb.checked) selectedIds.add(cb.value); else selectedIds.delete(cb.value);
    updateBatchBar();
}

function toggleSelectAll() {
    let checked = document.getElementById('select-all').checked;
    document.querySelectorAll('.row-check').forEach(cb => {
        cb.checked = checked;
        if (checked) selectedIds.add(cb.value); else selectedIds.delete(cb.value);
    });
    updateBatchBar();
}

function updateBatchBar() {
    let bar = document.getElementById('batch-actions');
    let count = selectedIds.size;
    bar.style.display = count > 0 ? 'flex' : 'none';
    document.getElementById('batch-count').textContent = '已选 ' + count + ' 项';
}

function batchToggle(enable) {
    if (selectedIds.size === 0 || busy) return;
    busy = true;
    fetch('/dashboard/api/tasks/batch/toggle', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: Array.from(selectedIds), enable: enable})
    }).then(r => r.json()).then(d => { busy = false; if (d.success) refresh(); else toast('操作失败', true); })
      .catch(() => { busy = false; toast('操作失败', true); });
}

function batchDelete() {
    if (selectedIds.size === 0 || busy) return;
    if (!confirm('确认删除选中的 ' + selectedIds.size + ' 个任务？')) return;
    busy = true;
    fetch('/dashboard/api/tasks/batch/delete', {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: Array.from(selectedIds)})
    }).then(r => r.json()).then(d => { busy = false; if (d.success) refresh(); else toast('删除失败', true); })
      .catch(() => { busy = false; toast('删除失败', true); });
}

function batchRelease() {
    if (selectedIds.size === 0 || busy) return;
    busy = true;
    fetch('/dashboard/api/tasks/batch/release', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ids: Array.from(selectedIds)})
    }).then(r => r.json()).then(d => { busy = false; if (d.success) refresh(); else toast('释放失败', true); })
      .catch(() => { busy = false; toast('释放失败', true); });
}

function refresh() { loadStats(); loadTasks(); }

function search() { page = 1; loadTasks(); }
function resetSearch() {
    document.getElementById('search-task').value = '';
    document.getElementById('search-biz').value = '';
    document.getElementById('search-bizGroup').value = '';
    document.getElementById('search-enable').value = '';
    document.getElementById('search-process').value = '';
    sortBy = ''; sortDir = '';
    page = 1; loadTasks();
}
function prevPage() { if (page > 1 && !busy) { page--; loadTasks(); } }
function nextPage() { if (page < totalPages && !busy) { page++; loadTasks(); } }

function toggleEnable(id) {
    if (busy) return;
    busy = true;
    fetch('/dashboard/api/tasks/' + encodeURIComponent(id) + '/toggle', { method: 'PUT' })
        .then(r => r.json())
        .then(d => { busy = false; if (d.success) refresh(); else toast('操作失败', true); })
        .catch(() => { busy = false; toast('操作失败', true); });
}
function releaseTask(id) {
    if (busy) return;
    busy = true;
    fetch('/dashboard/api/tasks/' + encodeURIComponent(id) + '/release', { method: 'PUT' })
        .then(r => r.json())
        .then(d => { busy = false; if (d.success) refresh(); else toast('释放失败', true); })
        .catch(() => { busy = false; toast('释放失败', true); });
}
function delTask(id) {
    if (busy) return;
    if (!confirm('确认删除该任务？')) return;
    busy = true;
    fetch('/dashboard/api/tasks/' + encodeURIComponent(id), { method: 'DELETE' })
        .then(r => r.json())
        .then(d => { busy = false; if (d.success) refresh(); else toast('删除失败', true); })
        .catch(() => { busy = false; toast('删除失败', true); });
}

function showDetail(id) {
    document.getElementById('modal-body').innerHTML = '<div class="empty">加载中...</div>';
    document.getElementById('modal-overlay').classList.add('show');
    fetch('/dashboard/api/tasks/' + encodeURIComponent(id))
        .then(r => r.json())
        .then(d => {
            if (!d.success || !d.data) {
                document.getElementById('modal-body').innerHTML = '<div class="empty" style="color:#ef4444">加载失败</div>';
                return;
            }
            let t = d.data;
            let rows = [
                ['任务 ID', t.id],
                ['任务名', t.taskName],
                ['bizName', t.bizName],
                ['bizGroup', t.bizGroup],
                ['调度类型', t.scheduledType === '1' ? 'Cron' : (t.scheduledType === '2' ? '一次性' : t.scheduledType)],
                ['调度配置', t.scheduledConf || '一次性任务'],
                ['下次触发', t.nextTriggerTime ? new Date(t.nextTriggerTime).toLocaleString('zh-CN') : '-'],
                ['上次触发', t.lastTriggerTime ? new Date(t.lastTriggerTime).toLocaleString('zh-CN') : '-'],
                ['启用状态', t.enable === '1' ? '已启用' : '已禁用'],
                ['执行状态', t.process || ''],
                ['Topic', t.topic || '-'],
                ['Payload', '<code>' + esc(t.payload || '{}') + '</code>'],
                ['创建时间', t.createAt || '-'],
                ['更新时间', t.updateAt || '-']
            ];
            document.getElementById('modal-body').innerHTML = rows.map(r =>
                '<div class="kv"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>'
            ).join('');
        })
        .catch(() => {
            document.getElementById('modal-body').innerHTML = '<div class="empty" style="color:#ef4444">加载失败</div>';
        });
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('show');
}

function toggleAutoRefresh() {
    autoRefresh = !autoRefresh;
    let btn = document.getElementById('btn-auto-refresh');
    if (autoRefresh) {
        btn.textContent = '自动刷新: 开';
        btn.classList.remove('off');
        autoRefreshInterval = setInterval(refresh, 10000);
    } else {
        btn.textContent = '自动刷新: 关';
        btn.classList.add('off');
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
    }
}

function setSort(col) {
    if (sortBy === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
        sortBy = col;
        sortDir = 'asc';
    }
    page = 1;
    loadTasks();
}

function updateSortArrows() {
    document.querySelectorAll('.sort-arrow').forEach(el => el.textContent = '');
    if (sortBy && sortDir) {
        let arrow = document.getElementById('arrow-' + sortBy);
        if (arrow) arrow.textContent = sortDir === 'asc' ? '▲' : '▼';
    }
}

function exportCSV() {
    let taskName = document.getElementById('search-task').value.trim();
    let bizName = document.getElementById('search-biz').value.trim();
    let bizGroup = document.getElementById('search-bizGroup').value.trim();
    let enable = document.getElementById('search-enable').value;
    let process = document.getElementById('search-process').value;

    let params = new URLSearchParams({ page: 1, size: 10000 });
    if (taskName) params.set('taskName', taskName);
    if (bizName) params.set('bizName', bizName);
    if (bizGroup) params.set('bizGroup', bizGroup);
    if (enable) params.set('enable', enable);
    if (process) params.set('process', process);

    toast('正在导出...');
    fetch('/dashboard/api/tasks?' + params)
        .then(r => r.json())
        .then(d => {
            if (!d.list || d.list.length === 0) { toast('无数据可导出', true); return; }
            let headers = ['ID', '任务名', 'bizName', 'bizGroup', '调度配置', '下次触发', '启用', '执行状态', '创建时间'];
            let csv = '﻿' + headers.join(',') + '\n';
            csv += d.list.map(t => [
                '"' + (t.id || '') + '"',
                '"' + (t.taskName || '').replace(/"/g, '""') + '"',
                '"' + (t.bizName || '').replace(/"/g, '""') + '"',
                '"' + (t.bizGroup || '').replace(/"/g, '""') + '"',
                '"' + (t.scheduledConf || '一次性') + '"',
                '"' + (t.nextTriggerTime ? new Date(t.nextTriggerTime).toLocaleString('zh-CN') : '') + '"',
                '"' + (t.enable === '1' ? '启用' : '禁用') + '"',
                '"' + (t.process || '') + '"',
                '"' + (t.createAt || '') + '"'
            ].join(',')).join('\n');

            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'tasks_' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            URL.revokeObjectURL(url);
            toast('导出完成，共 ' + d.list.length + ' 条');
        })
        .catch(() => toast('导出失败', true));
}

function toast(msg, isError) {
    let el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + (isError ? 'error' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
}

function esc(s) { return s ? s.replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }
function escAttr(s) { return s ? s.replace(/'/g, "\\'").replace(/"/g, '&quot;') : ''; }

refresh();
</script>

# 测试配置 — 不连接真实服务，仅验证 Spring 上下文加载
spring.main.allow-bean-definition-overriding=true

# XXL-Job 基础配置（测试环境不连 Admin，但需要占位值）
xxl.job.admin.addresses=http://127.0.0.1:8080/xxl-job-admin
xxl.job.admin.accessToken=test_token
xxl.job.executor.appname=executor-example-test
xxl.job.executor.port=19998
xxl.job.executor.logpath=/tmp/xxl-job-executor-example-test
xxl.job.executor.logretentiondays=7

# Executor SDK 禁用（测试环境无 RocketMQ）
# 不配置 xxl.job.process.nameserver，SDK 自动配置不会激活

# ============================================================
# Executor Example — 示例应用配置
# ============================================================
# 端口说明：
#   - 8080: xxl-job-admin（调度中心）
#   - 8081: Executor 主服务（任务调度引擎）
#   - 8082: 本示例应用（业务方）
#   - 9999: Executor 嵌入式 XXL-Job 服务端口
#   - 9998: 本示例的 XXL-Job 执行器端口
# ============================================================

server.port=8082

# ==================== XXL-Job Admin 连接配置 ====================
xxl.job.admin.addresses=http://127.0.0.1:8080/xxl-job-admin
xxl.job.admin.accessToken=default_token
xxl.job.admin.timeout=3

# ==================== XXL-Job Executor 配置 ====================
xxl.job.executor.appname=executor-example
xxl.job.executor.ip=
xxl.job.executor.port=9998
xxl.job.executor.logpath=/data/applogs/xxl-job/executor-example
xxl.job.executor.logretentiondays=30

# ==================== Executor SDK（RocketMQ）配置 ====================
# 与 Executor 主服务使用相同的 NameServer 和 Topic
xxl.job.process.nameserver=<YOUR_NAMESERVER_IP>:9876
xxl.job.process.topic=executorConsumeTask
xxl.job.process.group=executorProduceGroup
# RocketMQ ACL 认证（必填，与 Broker 配置一致）
xxl.job.process.access-key=<YOUR_ACCESS_KEY>
xxl.job.process.secret-key=<YOUR_SECRET_KEY>

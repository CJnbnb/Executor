spring.application.name=executor-stress
server.port=8083

# RocketMQ Configuration — fill in your own NameServer and ACL credentials
xxl.job.process.nameserver=<YOUR_NAMESERVER_IP>:9876
xxl.job.process.topic=executorConsumeTask
xxl.job.process.group=executorConsumeMessageGroup
xxl.job.process.access-key=<YOUR_ACCESS_KEY>
xxl.job.process.secret-key=<YOUR_SECRET_KEY>
xxl.job.process.send-message-timeout=3000
xxl.job.process.retry-times-when-send-failed=2
xxl.job.process.upsert-group=executorUpsertGroup
xxl.job.producer.produceGroup=executorProduceGroup

# XXL-Job Executor
xxl.job.executor.address=
xxl.job.executor.ip=
xxl.job.executor.port=9999
xxl.job.executor.logpath=/data/applogs/xxl-job/jobhandler
xxl.job.executor.logretentiondays=30

# XXL-Job Admin — stress test bypasses admin
xxl.job.admin.address=http://localhost:8080/xxl-job-admin
xxl.job.admin.token=default_token
xxl.job.admin.appname=

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*Mapper.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ════════════════════════════════════════════════════════════════════
# Layered Stress Test Configuration
# ════════════════════════════════════════════════════════════════════

# MQ mode: set to true for Layer 1 (Mock MQ / pure scheduler benchmark)
# Leave false for Layer 2 (Local MQ) and Layer 3 (Full Chain)
stress.mq.mock=false
# Simulated send delay in mock mode (0 = instant, useful for sensitivity analysis)
stress.mq.mock-delay-ms=0

# DataSource — fill in your own MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/xxl_job_executor_mq?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=<YOUR_DB_PASSWORD>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
